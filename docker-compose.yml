name: parcelvision

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcelvision}
      POSTGRES_USER: ${POSTGRES_USER:-parcelvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelvision-dev-only}
    volumes:
      # PG 18 images keep data in a version subdir under /var/lib/postgresql;
      # mounting the old /var/lib/postgresql/data path breaks startup.
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcelvision} -d ${POSTGRES_DB:-parcelvision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/seed:/seed:ro
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    # RQ quits on transient Redis timeouts (observed live); let Docker revive it.
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # geoai's tile downloads render tqdm bars; in container logs that's noise
      TQDM_DISABLE: "1"
    volumes:
      # Persist downloaded model weights + NAIP tiles between runs
      - model_cache:/root/.cache
      - imagery:/data/imagery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  model_cache:
  imagery:
