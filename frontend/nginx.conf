server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS. Without this + the variable below, nginx
        # resolves `api` once at startup and 502s forever after the api
        # container is recreated with a new IP.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        # Forward the real client so the API can rate-limit + log per IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CPU inference exports can be slow to assemble; be generous.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
