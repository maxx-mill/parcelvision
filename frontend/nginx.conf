server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # CPU inference exports can be slow to assemble; be generous.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
