# Root config for dev tooling only. Each service pins its own runtime deps
# in its own pyproject.toml (api/, worker/).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is black's job. B008: FastAPI's `Depends(...)` in defaults
# is the framework's core idiom, not the bug B008 hunts.
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
